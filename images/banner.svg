<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="OpenEdge ABL Developer Pack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b34"/>
      <stop offset="0.55" stop-color="#0e2a4d"/>
      <stop offset="1" stop-color="#123e6b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- node / orchestration motif -->
  <g stroke="url(#accent)" stroke-width="2" opacity="0.55" fill="none">
    <line x1="980" y1="90" x2="1110" y2="160"/>
    <line x1="1110" y1="160" x2="1010" y2="260"/>
    <line x1="1010" y1="260" x2="880" y2="210"/>
    <line x1="880" y1="210" x2="980" y2="90"/>
    <line x1="1110" y1="160" x2="1190" y2="250"/>
    <line x1="880" y1="210" x2="980" y2="90"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="980" cy="90" r="9"/>
    <circle cx="1110" cy="160" r="11"/>
    <circle cx="1010" cy="260" r="9"/>
    <circle cx="880" cy="210" r="8"/>
    <circle cx="1190" cy="250" r="7"/>
  </g>

  <!-- left accent bar -->
  <rect x="80" y="96" width="8" height="168" rx="4" fill="url(#accent)"/>

  <!-- text -->
  <text x="116" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="6" fill="#22d3ee">OEDP</text>
  <text x="116" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">OpenEdge ABL</text>
  <text x="116" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">Developer Pack</text>
  <text x="118" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#9fc1e8">Progress OpenEdge ABL / 4GL  ·  language support, tooling &amp; AI automation</text>
</svg>
