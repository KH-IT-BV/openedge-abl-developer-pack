name: openedge-openapi-skills
version: 0.2.0
description: AI-tool skill for the OpenEdge ABL - OpenAPI VS Code extension — generate ABL client/server code from OpenAPI specs via a standalone stdio MCP server.
author:
  name: KH-IT
  url: https://github.com/KH-IT-BV
license: UNLICENSED
repository: https://github.com/KH-IT-BV/openedge-abl-developer-pack
keywords: [openedge, abl, openapi, codegen, mcp, ai-tools]
type: skill
targets:
  - copilot
  - claude
  - cursor
  - codex
includes: auto
dependencies:
  apm: []
  # Self-defined stdio MCP server (JS-only — generates ABL code via the remote ABL
  # generator API, no OpenEdge runtime). The bundled server ships in
  # ../../mcp-servers/openapi/ (generated by `npm run build-mcp` from the vscode-openapi
  # repo). ${OEDP_MCP_HOME} resolves to the mcp-servers directory at runtime.
  mcp:
    - name: openedge-openapi
      registry: false
      transport: stdio
      command: node
      args: ["${OEDP_MCP_HOME}/openapi/index.cjs"]
      env:
        OPENAPI_DEFAULT_ENVIRONMENT: "2026q1"
