name: openedge-datadigger-skills
version: 0.2.0
description: AI-tool skill for the OpenEdge DataDigger VS Code extension — browse/query OpenEdge databases via the `openedge-datadigger` MCP server, with a headless launcher CLI + HTTP backend as fallback.
author:
  name: KH-IT
  url: https://github.com/KH-IT-BV
license: UNLICENSED
repository: https://github.com/KH-IT-BV/openedge-abl-developer-pack
keywords: [openedge, abl, database, datadigger, mcp, ai-tools]
type: skill
targets:
  - copilot
  - claude
  - cursor
  - codex
includes: auto
dependencies:
  apm: []
  # Self-defined stdio MCP server. The bundled, standalone server ships in
  # ../../mcp-servers/datadigger/ (generated by `npm run build-mcp` from the canonical
  # source in the vscode-openedge-datadigger repo). ${OEDP_MCP_HOME} is resolved by the
  # harness at runtime to that mcp-servers directory; DLC must point at a local OpenEdge.
  mcp:
    - name: openedge-datadigger
      registry: false
      transport: stdio
      command: node
      args: ["${OEDP_MCP_HOME}/datadigger/index.cjs"]
      env:
        DLC: "C:/Program Files/Progress Software/OpenEdge/dlc128"
        DATADIGGER_MCP_LAUNCHER_PATH: "${OEDP_MCP_HOME}/datadigger/native/launcher/datadiggerLauncherCli.js"
        DATADIGGER_MCP_BACKEND_PATH: "${OEDP_MCP_HOME}/datadigger/datadigger_backend"
        DATADIGGER_MCP_WRITES_ENABLED: "false"
        DATADIGGER_OE_CONFIG: "${OEDP_MCP_HOME}/datadigger/connections.json"
