name: openedge-hck-skills
version: 0.2.0
description: AI-tool skill for the OpenEdge HCK - Health Check Kit VS Code extension — run health checks/read diagnostics via the `openedge-hck` MCP server (18 read tools + 2 confirmed actions), with a headless launcher CLI + HTTP backend as fallback.
author:
  name: KH-IT
  url: https://github.com/KH-IT-BV
license: UNLICENSED
repository: https://github.com/KH-IT-BV/openedge-abl-developer-pack
keywords: [openedge, abl, health-check, diagnostics, monitoring, mcp, ai-tools]
type: skill
targets:
  - copilot
  - claude
  - cursor
  - codex
includes: auto
dependencies:
  apm: []
  # Self-defined stdio MCP server. The bundled, standalone server ships in
  # ../../mcp-servers/hck/ (generated by `npm run build-mcp` from the canonical source in
  # the vscode-openEdge-HCK repo). ${OEDP_MCP_HOME} resolves to the mcp-servers directory
  # at runtime; DLC must point at a local OpenEdge. HCK tools take an inline `conn` ABL
  # connection string (credentials included) plus a `db` logical name per call.
  mcp:
    - name: openedge-hck
      registry: false
      transport: stdio
      command: node
      args: ["${OEDP_MCP_HOME}/hck/index.cjs"]
      env:
        DLC: "C:/Program Files/Progress Software/OpenEdge/dlc128"
        HCK_MCP_LAUNCHER_PATH: "${OEDP_MCP_HOME}/hck/native/launcher/hckLauncherCli.js"
        HCK_MCP_BACKEND_PATH: "${OEDP_MCP_HOME}/hck/hck_backend"
