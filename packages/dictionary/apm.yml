name: openedge-dictionary-skills
version: 0.2.0
description: AI-tool skill for the OpenEdge Data Administration (Dictionary) VS Code extension — inspect/administer OpenEdge schema via the `openedge-dictionary` MCP server (~50 tools), with a headless launcher CLI + HTTP backend as fallback.
author:
  name: KH-IT
  url: https://github.com/KH-IT-BV
license: UNLICENSED
repository: https://github.com/KH-IT-BV/openedge-abl-developer-pack
keywords: [openedge, abl, schema, dictionary, dump-load, mcp, ai-tools]
type: skill
targets:
  - copilot
  - claude
  - cursor
  - codex
includes: auto
dependencies:
  apm: []
  # Self-defined stdio MCP server. The bundled, standalone server ships in
  # ../../mcp-servers/dictionary/ (generated by `npm run build-mcp` from the canonical
  # source in the vscode-openedge-dictionary repo). ${OEDP_MCP_HOME} is resolved by the
  # harness at runtime to that mcp-servers directory; DLC must point at a local OpenEdge.
  mcp:
    - name: openedge-dictionary
      registry: false
      transport: stdio
      command: node
      args: ["${OEDP_MCP_HOME}/dictionary/index.cjs"]
      env:
        DLC: "C:/Program Files/Progress Software/OpenEdge/dlc128"
        DICTIONARY_MCP_LAUNCHER_PATH: "${OEDP_MCP_HOME}/dictionary/native/launcher/dictionaryLauncherCli.js"
        DICTIONARY_MCP_BACKEND_PATH: "${OEDP_MCP_HOME}/dictionary/dictionary_backend"
        DICTIONARY_OE_CONFIG: "${OEDP_MCP_HOME}/dictionary/connections.json"
