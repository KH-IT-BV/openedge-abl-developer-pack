name: openedge-pasoe-skills
version: 0.2.0
description: AI-tool skill for the OpenEdge ABL - PASOE VS Code extension — manage PASOE/OEPAS servers via the PASOE MCP server (status, instance config, MS-Agent lifecycle, PAAR deployment), plus commands, server config, and OAuth.
author:
  name: KH-IT
  url: https://github.com/KH-IT-BV
license: UNLICENSED
repository: https://github.com/KH-IT-BV/openedge-abl-developer-pack
keywords: [openedge, abl, pasoe, oepas, appserver, mcp, ai-tools]
type: skill
targets:
  - copilot
  - claude
  - cursor
  - codex
includes: auto
dependencies:
  apm: []
  # Self-defined stdio MCP server (JS-only — talks to remote OE Manager REST, no OpenEdge
  # runtime). The bundled server ships in ../../mcp-servers/pasoe/ (generated by
  # `npm run build-mcp` from the vscode-openedge-pasoe repo). ${OEDP_MCP_HOME} resolves to
  # the mcp-servers directory at runtime. Copy servers.example.json -> servers.json and
  # fill in your PASOE server(s) before use.
  mcp:
    - name: openedge-pasoe
      registry: false
      transport: stdio
      command: node
      args: ["${OEDP_MCP_HOME}/pasoe/index.cjs"]
      env:
        PASOE_SERVERS_CONFIG_PATH: "${OEDP_MCP_HOME}/pasoe/servers.json"
        PASOE_SECRET_STORE_PATH: "${OEDP_MCP_HOME}/pasoe/secrets.json"
        PASOE_DLC_PATH: "C:/Program Files/Progress Software/OpenEdge/dlc128"
